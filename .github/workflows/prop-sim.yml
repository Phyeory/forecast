name: prop-sim
on:
  schedule:
    - cron: '0 5 * * 1-6'
    - cron: '30 5 * * 1-6'
    - cron: '0 8 * * 1-6'
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daily prop-sim step
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: bash deploy/run_daily.sh
      - name: Commit account state
        run: |
          git config user.name "prop-sim-bot"
          git config user.email "prop-sim-bot@users.noreply.github.com"
          echo "runtime/snap.pkl.gz" >> .gitignore || true
          git add -A runtime .gitignore || true
          git reset -q runtime/snap.pkl.gz 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state change"; exit 0
          fi
          git commit -m "state: $(date -u +%FT%TZ)" || exit 0
          git push
