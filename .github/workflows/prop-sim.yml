name: prop-sim
on:
  schedule:
    # Alpaca timestamps a daily bar at 00:00 ET of its session (04:00 UTC in
    # EDT, 05:00 UTC in EST) and the stack treats it as closed one day later
    # (timestamp + 24 h).  The next session opens at 13:30 UTC, so a run
    # between 05:00 and 13:30 UTC decides AFTER the bar is closed and still
    # BEFORE the open it must fill at -> the "fill at the next open" price is
    # one the order could actually have caught.  05:00 UTC + a 05:30 backup.
    - cron: "0 5 * * 1-6"
    - cron: "30 5 * * 1-6"
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write          # commit the account state back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daily prop-sim step
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: bash deploy/run_daily.sh
      - name: Commit account state
        run: |
          git config user.name "prop-sim-bot"
          git config user.email "prop-sim-bot@users.noreply.github.com"
          git add -A runtime || true
          if git diff --staged --quiet; then
            echo "no state change"; exit 0
          fi
          git commit -m "state: $(date -u +%FT%TZ)" || exit 0
          git push
