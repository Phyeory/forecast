<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pump-chart · Strategy Dashboard</title>
  <meta name="description" content="Real-time Solana token charting with physics-based strategy engine and forward testing" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div id="logo">pump<span>chart</span></div>
    <form id="address-form" onsubmit="return false">
      <input id="mint-input" type="text" placeholder="Enter pump.fun token address…" autocomplete="off" spellcheck="false" />
      <button id="load-btn" type="button">Load Chart</button>
    </form>
    <div id="tf-bar">
      <button class="tf-btn"        data-tf="1s">1s</button>
      <button class="tf-btn"        data-tf="5s">5s</button>
      <button class="tf-btn"        data-tf="15s">15s</button>
      <button class="tf-btn active" data-tf="1m">1m</button>
      <button class="tf-btn"        data-tf="5m">5m</button>
      <button class="tf-btn"        data-tf="15m">15m</button>
      <button class="tf-btn"        data-tf="1h">1h</button>
    </div>
    <div id="conn-indicator">
      <div id="dot" class="dot"></div>
      <span id="conn-label">Idle</span>
    </div>
  </header>

  <div id="token-bar" class="hidden">
    <img id="token-logo" alt="" />
    <span id="token-name">—</span>
    <span id="token-symbol"></span>
    <div style="width:1px;height:24px;background:var(--border)"></div>
    <div id="ohlc-strip" class="ohlc-strip">
      <span class="ohlc-item">O <span id="ohlc-open">—</span></span>
      <span class="ohlc-item">H <span id="ohlc-high">—</span></span>
      <span class="ohlc-item">L <span id="ohlc-low">—</span></span>
      <span class="ohlc-item">C <span id="ohlc-close">—</span></span>
    </div>
    <div style="width:1px;height:24px;background:var(--border)"></div>
    <span id="last-price">—</span>
    <span id="price-change" class="price-change">—</span>
    <div style="width:1px;height:24px;background:var(--border)"></div>
    <div class="stat-item">
      <span class="stat-label">Mkt Cap</span>
      <span class="stat-value" id="stat-mcap">—</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Session Vol</span>
      <span class="stat-value" id="stat-vol">0 SOL</span>
    </div>
    <!-- Strategy indicators in token bar -->
    <div style="width:1px;height:24px;background:var(--border)"></div>
    <div id="regime-badge" class="regime-badge">IDLE</div>
    <div id="direction-badge" class="direction-badge">— NONE</div>
    <div class="stat-item">
      <span class="stat-label">Signal S</span>
      <span class="stat-value" id="signal-strength">0.00</span>
    </div>
  </div>

  <div id="main-content">
    <!-- Left: Strategy panel -->
    <aside id="strategy-panel">
      <div class="panel-section">
        <h3 class="panel-title">📊 Indicators</h3>
        <div id="indicators-display" class="indicators-grid"></div>
      </div>
      <div class="panel-section">
        <h3 class="panel-title">💰 Forward Test</h3>
        <div id="ft-stats" class="ft-grid"></div>
      </div>
    </aside>

    <!-- Center: Chart + Sub panes -->
    <div id="chart-area">
      <div id="chart-wrapper">
        <div id="chart"></div>
        <div id="trade-feed"></div>
        <div id="overlay">
          <div id="overlay-icon">📈</div>
          <div id="overlay-msg">Enter a pump.fun token address above to start.</div>
        </div>
      </div>
      <!-- Regime color bar -->
      <div id="regime-bar-canvas" class="sub-pane-wrapper regime-bar-wrapper"></div>
      <!-- ROC + ATR sub panes -->
      <div id="sub-pane" class="sub-pane-wrapper"></div>
    </div>
  </div>

</div>
<script src="/static/js/app.js?v=2"></script>
</body>
</html>
